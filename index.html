<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manitas Fácil · Arregla tú mismo, paso a paso</title>
<meta name="description" content="Tutoriales sencillos para reparaciones del hogar, bricolaje y jardinería, explicados sin tecnicismos.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🔧%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:wght@700;800&display=swap">
<link rel="stylesheet" href="./css/styles.css">
</head>
<body>
<a class="skip" href="#contenido">Saltar al contenido</a>
<header class="cabecera">
  <a class="logo" href="./" aria-label="Manitas Fácil, inicio">Manitas<span>Fácil</span></a>
  <p class="lema">Arréglalo tú mismo. Sin palabras raras.</p>
  <button id="btn-nuevo" class="btn">Añadir tutorial</button>
</header>

<main id="contenido">
  <section id="vista-lista">
    <div class="buscador">
      <label for="q">¿Qué quieres arreglar?</label>
      <input id="q" type="search" placeholder="Ej.: enchufe, puerta, césped…" autocomplete="off">
    </div>
    <div id="filtros" class="filtros" role="group" aria-label="Filtrar por categoría"></div>
    <p id="contador" class="contador" aria-live="polite"></p>
    <ul id="lista" class="lista"></ul>
  </section>
  <article id="vista-guia" hidden></article>
</main>

<dialog id="dlg">
  <form id="form" method="dialog">
    <h2>Nuevo tutorial</h2>
    <p class="nota">Se guarda solo en este navegador (localStorage).</p>
    <label>Título <input name="titulo" required></label>
    <label>Categoría <input name="categoria" list="cats" required placeholder="Ej.: Fontanería"></label>
    <datalist id="cats"></datalist>
    <div class="dos">
      <label>Tiempo estimado <input name="tiempo" placeholder="30 min" required></label>
      <label>Dificultad
        <select name="dificultad"><option>Muy fácil</option><option>Fácil</option><option>Media</option></select>
      </label>
    </div>
    <label>Herramientas y materiales (uno por línea)<textarea name="herramientas" rows="3" required></textarea></label>
    <label>Aviso de seguridad (opcional)<input name="seguridad"></label>
    <label>Pasos (uno por línea, cortos)<textarea name="pasos" rows="5" required></textarea></label>
    <label>¿Algo salió mal? (una línea por fallo: <em>fallo | solución</em>)<textarea name="problemas" rows="3"></textarea></label>
    <details>
      <summary>O pega un tutorial en formato JSON</summary>
      <textarea id="json" rows="5" placeholder='{"titulo":"…","categoria":"…","tiempo":"…","dificultad":"Fácil","herramientas":["…"],"pasos":[{"texto":"…"}]}'></textarea>
      <button type="button" id="btn-json" class="btn sec">Importar JSON</button>
    </details>
    <p id="err" class="err" role="alert"></p>
    <div class="acciones">
      <button value="cancel" class="btn sec" formnovalidate>Cancelar</button>
      <button type="submit" class="btn">Guardar tutorial</button>
    </div>
  </form>
</dialog>

<footer class="pie">Manitas Fácil · Consejos generales. Si dudas, llama a un profesional.</footer>
<script src="./js/data.js"></script>
<script src="./js/tutoriales-extra.js"></script>
<script src="./js/tutoriales-3.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
